[workspace]
resolver = "2"
members = [
    "crates/lupine-core",
    "crates/lupine-kem",
    "crates/lupine-sign",
    "crates/lupine-serial",
    "crates/lupine",
    "crates/lupine-cli",
    "crates/canus-lupus",
    "crates/lupine-cert",
    "crates/lupine-wasm",
]
# fuzz/ is managed by cargo-fuzz and has its own build system.
# Excluding it here prevents `cargo build/test --workspace` from pulling in
# libfuzzer-sys, which is only available when cargo-fuzz is installed.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/im40percentgit/lupine"
homepage = "https://github.com/im40percentgit/lupine"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
lupine-core = { path = "crates/lupine-core", version = "0.1.0", default-features = false }
lupine-kem = { path = "crates/lupine-kem", version = "0.1.0" }
lupine-sign = { path = "crates/lupine-sign", version = "0.1.0" }
lupine-serial = { path = "crates/lupine-serial", version = "0.1.0" }

# PQC primitives (RustCrypto)
# ml-kem 0.2 internally depends on kem = "0.3.0-pre.0" (not a stable release).
# lupine-kem uses ml_kem::kem re-exports rather than a direct kem dep.
ml-kem = { version = "0.2", default-features = false, features = ["zeroize"] }
# ml-dsa and slh-dsa are RC-only; pinned versions activated in Phase 2.
# These crates require signature 3.x, rand_core 0.10, and rand 0.10 — all RC.
# lupine-sign carries those RC deps directly so lupine-kem (which uses the
# stable 0.6/0.8 versions) is unaffected. Cargo compiles both version trees.
ml-dsa = { version = "=0.1.0-rc.7", features = ["zeroize"] }
slh-dsa = { version = "=0.2.0-rc.4", features = ["zeroize"] }

# Classical crypto (for hybrid modes — Phase 3)
x25519-dalek = { version = "2", features = ["static_secrets"] }
# ed25519-dalek 2.x is stable; 3.x is pre-release. Keep at 2 for now.
ed25519-dalek = { version = "2", features = ["rand_core"] }

# AEAD (for the easy API — Layer 1)
chacha20poly1305 = "0.10"

# KDF / hashing
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }

# RustCrypto trait crates
# signature 2.x is stable; 3.x is RC. Phase 2 will evaluate upgrading.
signature = "2"

# Serialization (Phase 4)
# der 0.8 is the current stable release (2024). spki is still RC (0.8.0-rc.4)
# so we use a manual SPKI encoder in lupine-serial instead of taking an RC dep.
der = { version = "0.8", default-features = false, features = ["alloc", "derive", "oid"] }
pem-rfc7468 = { version = "1.0", default-features = false, features = ["alloc"] }
base64ct = { version = "1", default-features = false, features = ["alloc"] }

# Utilities
rand_core = { version = "0.6", default-features = false }
rand = { version = "0.8", default-features = false }
zeroize = { version = "1", features = ["derive"] }
hybrid-array = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Testing
proptest = "1"
hex = "0.4"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
