[workspace]
resolver = "2"
members = [
    "crates/lupine-core",
    "crates/lupine-kem",
    "crates/lupine-sign",
    "crates/lupine-serial",
    "crates/lupine",
    "crates/lupine-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/j/lupine"
rust-version = "1.75"

[workspace.dependencies]
# Internal crates
lupine-core = { path = "crates/lupine-core" }
lupine-kem = { path = "crates/lupine-kem" }
lupine-sign = { path = "crates/lupine-sign" }
lupine-serial = { path = "crates/lupine-serial" }

# PQC primitives (RustCrypto)
# ml-kem 0.2 internally depends on kem = "0.3.0-pre.0" (not a stable release).
# lupine-kem uses ml_kem::kem re-exports rather than a direct kem dep.
ml-kem = "0.2"
# ml-dsa and slh-dsa are RC-only; pinned versions activated in Phase 2.
# These crates require signature 3.x, rand_core 0.10, and rand 0.10 — all RC.
# lupine-sign carries those RC deps directly so lupine-kem (which uses the
# stable 0.6/0.8 versions) is unaffected. Cargo compiles both version trees.
ml-dsa = "=0.1.0-rc.7"
slh-dsa = "=0.2.0-rc.4"

# Classical crypto (for hybrid modes — Phase 3)
x25519-dalek = { version = "2", features = ["static_secrets"] }
# ed25519-dalek 2.x is stable; 3.x is pre-release. Keep at 2 for now.
ed25519-dalek = { version = "2", features = ["rand_core"] }

# KDF / hashing
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }

# RustCrypto trait crates
# signature 2.x is stable; 3.x is RC. Phase 2 will evaluate upgrading.
signature = "2"

# Serialization (Phase 4)
# der 0.8 is the current stable release (2024). spki is still RC (0.8.0-rc.4)
# so we use a manual SPKI encoder in lupine-serial instead of taking an RC dep.
der = { version = "0.8", features = ["alloc", "derive", "oid"] }
pem-rfc7468 = { version = "1.0", features = ["alloc"] }

# Utilities
rand_core = { version = "0.6", default-features = false }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hybrid-array = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
proptest = "1"
hex = "0.4"
