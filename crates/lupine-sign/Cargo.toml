[package]
name = "lupine-sign"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Signature implementations (ML-DSA, SLH-DSA, hybrid Ed25519+ML-DSA) for the Lupine PQC suite"

[features]
default = ["std"]
std = ["lupine-core/std"]
alloc = ["lupine-core/alloc"]

[dependencies]
lupine-core = { workspace = true }
# Phase 2 dependencies — pinned to RC versions matching the RustCrypto PQC
# release train. Uncommented when Phase 2 implementation begins.
# ml-dsa = { workspace = true }
# slh-dsa = { workspace = true }
# ed25519-dalek = { workspace = true }
# signature = { workspace = true }
rand_core = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
