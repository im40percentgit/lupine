[package]
name = "lupine-sign"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Signature implementations (ML-DSA, SLH-DSA, hybrid Ed25519+ML-DSA) for the Lupine PQC suite"
keywords = ["post-quantum", "cryptography", "ml-dsa", "slh-dsa", "fips204"]
categories = ["cryptography"]
readme = "README.md"

[features]
default = ["std"]
std = ["lupine-core/std"]
alloc = ["lupine-core/alloc"]

[dependencies]
lupine-core = { workspace = true }

# Phase 2 PQC signature crates (workspace-registered RC pinned versions).
ml-dsa = { workspace = true }
slh-dsa = { workspace = true }

# The RC signature crates require the RC release train of RustCrypto support
# crates.  These are listed directly here (not via workspace) so lupine-kem,
# which depends on the stable rand_core 0.6 / rand 0.8 / signature 2.x series,
# is completely unaffected.  Cargo compiles both version trees independently.
signature = "=3.0.0-rc.10"
rand_core = "=0.10.0"
rand = "=0.10.0"
zeroize = { workspace = true }
# Phase 3 (hybrid Ed25519+ML-DSA) — ed25519-dalek 2.x uses signature 2.x
# internally but we access it via its native API so there is no trait conflict.
ed25519-dalek = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
proptest = { workspace = true }
rand = "=0.10.0"
criterion = { workspace = true }

[[bench]]
name = "sign"
harness = false
