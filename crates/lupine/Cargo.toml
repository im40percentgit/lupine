[package]
name = "lupine-pqc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Lupine — Post-Quantum Cryptographic Suite (FIPS 203/204/205)"
keywords = ["post-quantum", "cryptography", "pqc", "fips", "security"]
categories = ["cryptography"]
readme = "README.md"

[lib]
name = "lupine"
path = "src/lib.rs"

[features]
# `std` enables the std::error::Error impl on lupine_core::Error and standard
# allocator support across all constituent crates.
default = ["std", "easy"]
std = ["lupine-core/std", "lupine-kem/std", "lupine-sign/std", "lupine-serial/std"]
alloc = ["lupine-core/alloc", "lupine-kem/alloc", "lupine-sign/alloc", "lupine-serial/alloc"]
# `easy` enables the high-level encrypt/decrypt/sign/verify API (Layer 1).
# It pulls in AEAD (ChaCha20-Poly1305), HKDF, SHA-256, and OsRng — all std-requiring.
# Disable this feature for no_std builds that only need the raw PQC primitives.
easy = ["dep:chacha20poly1305", "dep:hkdf", "dep:sha2", "dep:rand", "dep:rand010", "dep:ml-kem", "dep:ml-dsa", "std"]

[dependencies]
lupine-core = { workspace = true }
lupine-kem = { workspace = true }
lupine-sign = { workspace = true }
lupine-serial = { workspace = true }
# Needed to zeroize ephemeral AEAD key material in easy.rs after use.
zeroize = { workspace = true }

# easy-feature deps (optional — only compiled when `easy` feature is active)
chacha20poly1305 = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# rand 0.8 (workspace) — used for OsRng (KEM encapsulation) and random nonce generation.
# lupine-kem requires rand_core 0.6's CryptoRngCore; rand 0.8 satisfies it.
rand = { workspace = true, optional = true, features = ["std", "std_rng"] }
# rand 0.10 — required to satisfy lupine-sign's CryptoRng bound.  Any 0.10.x
# is compatible (stable semver); Cargo.lock pins the exact resolved version.
# Package alias avoids name conflicts with the rand 0.8 workspace dep above.
rand010 = { package = "rand", version = "0.10", features = ["thread_rng"], optional = true }
# Type parameters for generate_keypair<P> — named directly so easy.rs can write
# ml_kem::MlKem768 and ml_dsa::MlDsa65 as concrete type parameters.
ml-kem = { workspace = true, optional = true, features = ["std"] }
ml-dsa = { workspace = true, optional = true }
