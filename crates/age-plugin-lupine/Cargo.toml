[package]
name = "age-plugin-lupine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Post-quantum age plugin using hybrid X25519+ML-KEM-768"
keywords = ["post-quantum", "cryptography", "age", "encryption", "plugin"]
categories = ["cryptography", "command-line-utilities"]

[[bin]]
name = "age-plugin-lupine"
path = "src/main.rs"

[lib]
name = "age_plugin_lupine"
path = "src/lib.rs"

[dependencies]
lupine-kem = { workspace = true }
lupine-core = { workspace = true }
ml-kem = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
chacha20poly1305 = { workspace = true }
rand = { workspace = true, features = ["std", "std_rng"] }
bech32 = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
