[package]
name = "lupine-cert"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "X.509v3 certificate generation and validation for the Lupine PQC suite"
keywords = ["post-quantum", "cryptography", "x509", "certificate", "pqc"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
lupine-core = { workspace = true }
lupine-sign = { workspace = true }
lupine-serial = { workspace = true }
der = { workspace = true, default-features = false }
# lupine-sign uses rand 0.10 / rand_core 0.10 (RC) for its CryptoRng bound.
# We need the same version to pass an RNG to generate_keypair.
rand = "0.10"
# ml-dsa is needed for the generic type parameters (MlDsa44, MlDsa65, MlDsa87)
# used in lupine-sign's generic keygen/sign API.
ml-dsa = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
