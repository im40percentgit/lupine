[package]
name = "lupine-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "WebAssembly bindings for Lupine post-quantum cryptography"
keywords = ["post-quantum", "cryptography", "wasm", "webassembly", "pqc"]
categories = ["cryptography", "wasm"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lupine = { package = "lupine-pqc", path = "../lupine", version = "0.1.0" }
lupine-core = { workspace = true }
lupine-kem = { workspace = true }
lupine-sign = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["web"]
web = []   # Browser target (crypto.getRandomValues via getrandom js feature)
wasi = []  # WASI target (placeholder for future WASI random_get support)
