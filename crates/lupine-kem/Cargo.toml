[package]
name = "lupine-kem"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KEM implementations (ML-KEM, hybrid X25519+ML-KEM) for the Lupine PQC suite"

[features]
default = ["std"]
std = ["lupine-core/std"]
alloc = ["lupine-core/alloc"]

[dependencies]
lupine-core = { workspace = true }
ml-kem = { workspace = true }
x25519-dalek = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
kem = { workspace = true }
rand_core = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
hybrid-array = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
