[package]
name = "lupine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for the Lupine PQC suite"
keywords = ["post-quantum", "cryptography", "cli", "pqc", "fips"]
categories = ["cryptography", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "lupine"
path = "src/main.rs"

[dependencies]
lupine = { package = "lupine-pqc", path = "../lupine", version = "0.1.0" }
lupine-core = { workspace = true, features = ["std"] }
lupine-kem = { workspace = true }
lupine-sign = { workspace = true }
lupine-serial = { workspace = true }
ml-kem = { workspace = true, features = ["std"] }
ml-dsa = { workspace = true }
slh-dsa = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
rand = { workspace = true, features = ["std", "std_rng"] }
rand_010 = { package = "rand", version = "=0.10.1" }
rand_core_010 = { package = "rand_core", version = "=0.10.0" }
anyhow = { workspace = true }
