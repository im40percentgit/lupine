[package]
name = "canus-lupus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "canus-lupus — Post-quantum Swiss Army Knife CLI (Layer 2 of the canus-lupus stack)"
keywords = ["post-quantum", "cryptography", "cli", "pqc", "security"]
categories = ["cryptography", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "canus-lupus"
path = "src/main.rs"

[dependencies]
# High-level API (Layer 1) — requires the `easy` feature which is on by default.
lupine = { package = "lupine-pqc", path = "../lupine", version = "0.1.0" }
# Internal crates — needed for concrete key types used in keystore.
lupine-core = { workspace = true }
lupine-kem = { workspace = true }
lupine-sign = { workspace = true }
# Serial crate for PEM encoding/decoding of keys.
lupine-serial = { workspace = true }
# Certificate generation and validation (Phase 15).
lupine-cert = { path = "../lupine-cert", version = "0.1.0" }
# DER types used for OID display in the cert subcommand.
der = { workspace = true, default-features = false }
# CLI argument parsing.
clap = { workspace = true }
# Error handling for CLI tools.
anyhow = { workspace = true }
# Home directory resolution.
dirs-next = "2"
# Zeroize sensitive key bytes loaded from disk before they are dropped.
zeroize = { workspace = true }

[dev-dependencies]
# Temporary directories for integration tests.
tempfile = "3"
