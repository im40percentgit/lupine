[package]
name = "lupine-serial"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Serialization (DER, PEM, SPKI) for the Lupine PQC suite"

[features]
default = ["std"]
std = ["lupine-core/std"]
alloc = ["lupine-core/alloc"]

[dependencies]
lupine-core = { workspace = true }
lupine-kem = { workspace = true }
lupine-sign = { workspace = true }
der = { workspace = true }
pem-rfc7468 = { workspace = true }
# spki crate is still RC (0.8.0-rc.4); SPKI encoding is done manually instead.

[dev-dependencies]
hex = { workspace = true }
